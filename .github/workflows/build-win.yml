name: Windows Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Fetch prebuilt better-sqlite3 for Electron
        shell: pwsh
        run: |
          cd node_modules/better-sqlite3
          npx prebuild-install --runtime=electron --target=43.2.0 --arch=x64 --platform=win32 --verbose

      - name: Build portable exe
        run: npm run dist:win
        env:
          ELECTRON_BUILDER_SKIP_REBUILD: "true"

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: petsis-servis-formu-windows
          path: dist/*.exe