name: Windows Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Update node-gyp
        shell: pwsh
        run: |
          npm install -g node-gyp@latest
          echo "npm_config_node_gyp=$(npm prefix -g)\node_modules\node-gyp\bin\node-gyp.js" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Install dependencies
        run: npm install
        env:
          npm_config_msvs_version: 2022

      - name: Build portable exe
        run: npm run dist:win
        env:
          npm_config_msvs_version: 2022

      - name: Upload exe
        uses: actions/upload-artifact@v4
        with:
          name: petsis-servis-formu-windows
          path: dist/*.exe